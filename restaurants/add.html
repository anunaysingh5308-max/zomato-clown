<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>adds</title>
    <style>
        /* =========================
   RESET
========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }


        /* =========================
   BODY
========================= */

        body {
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 30px 15px;

            background:
                linear-gradient(rgba(255, 225, 225, 0.9),
                    rgba(255, 245, 245, 0.95)),
                url("img/background.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: #4a2020;
        }


        /* =========================
   INTRODUCTION TEXT
========================= */

        body> :first-child {
            width: 100%;
            max-width: 650px;

            margin-bottom: 25px;

            text-align: center;

            font-size: 18px;
            line-height: 1.6;

            color: #6b3333;
        }


        /* =========================
   FORM
========================= */

        form {
            width: 100%;
            max-width: 550px;

            padding: 35px;

            background: rgba(255, 255, 255, 0.95);

            border: 1px solid #ffc4c4;

            border-radius: 15px;

            box-shadow:
                0 10px 35px rgba(200, 50, 50, 0.15);

            animation: formAppear 0.8s ease;
        }


        /* =========================
   LABELS
========================= */

        form label {
            display: block;

            margin-bottom: 8px;

            color: #a52a2a;

            font-size: 15px;

            font-weight: bold;
        }


        /* =========================
   INPUTS
========================= */

        form input[type="text"] {
            width: 100%;

            height: 45px;

            padding: 10px 12px;

            margin-bottom: 18px;

            border: 1px solid #ffb3b3;

            border-radius: 7px;

            outline: none;

            background: #fffafa;

            color: #4a2020;

            font-size: 16px;

            transition: 0.3s;
        }


        /* Input focus effect */

        form input[type="text"]:focus {
            border-color: #e23744;

            background: #ffffff;

            box-shadow:
                0 0 0 3px rgba(226, 55, 68, 0.12);

            transform: translateY(-1px);
        }


        /* =========================
   SUBMIT BUTTON
========================= */

        form input[type="submit"] {
            width: 100%;

            height: 48px;

            margin-top: 5px;

            border: none;

            border-radius: 8px;

            background: #e23744;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        /* Button hover */

        form input[type="submit"]:hover {
            background: #c92132;

            transform: translateY(-2px);

            box-shadow:
                0 6px 15px rgba(226, 55, 68, 0.25);
        }


        /* Button click */

        form input[type="submit"]:active {
            transform: scale(0.97);
        }


        /* =========================
   ANIMATION
========================= */

        @keyframes formAppear {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
   MOBILE
========================= */

        @media (max-width: 600px) {

            body {
                padding: 20px 12px;
            }

            form {
                padding: 25px 20px;
            }

            body> :first-child {
                font-size: 16px;
            }

            form input[type="text"] {
                font-size: 15px;
            }

            form input[type="submit"] {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <h1>
        Add your restaurant to Zomato and reach a wider audience of food lovers. Fill out the form below to get
            started.
    </h1>
    <form action="/submit-restaurant" method="POST">
        <label for="restaurantName">Restaurant Name:</label>
        <input type="text" id="restaurantName" name="restaurantName" required><br><br>
        <label for="address">Address:</label>
        <input type="text" id="address" name="address" required><br><br>
        <label for="cuisine">Cuisine Type:</label>
        <input type="text" id="cuisine" name="cuisine" required><br><br>
        <label for="contact">Contact Number:</label>
        <input type="text" id="contact" name="contact" required><br><br>
        <input type="submit" value="Submit">
    </form>
</body>

</html>
